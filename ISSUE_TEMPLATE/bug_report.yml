name: "🐞 버그 리포트"
description: "버그나 오류를 제보합니다."
title: "[BUG] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        버그 제보 감사합니다! 재현할 수 있도록 최대한 자세히 적어 주세요.

  - type: textarea
    id: description
    attributes:
      label: "🐛 버그 설명"
      description: "어떤 문제가 발생했는지 간단히 설명해 주세요."
      placeholder: "예) 로그인 후 메인 페이지에서 500 에러가 발생합니다."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "🔁 재현 방법"
      description: "버그를 재현하는 순서를 적어 주세요."
      placeholder: |
        1. '...' 페이지로 이동
        2. '...' 버튼 클릭
        3. 에러 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ 기대 동작"
      description: "원래 어떻게 동작해야 하나요?"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "📜 에러 로그 / 스크린샷"
      description: "로그는 자동으로 코드 블록 처리됩니다."
      render: shell

  - type: dropdown
    id: area
    attributes:
      label: "📍 발생 영역"
      options:
        - Backend
        - Frontend
        - DB
        - Infra / 배포
        - 기타
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: "💻 환경"
      placeholder: "예) macOS 14, Chrome 130, Node 20.x"

  - type: checkboxes
    id: checklist
    attributes:
      label: "체크리스트"
      options:
        - label: "중복된 이슈가 없는지 확인했습니다."
          required: true
