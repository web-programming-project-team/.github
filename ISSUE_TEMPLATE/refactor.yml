name: "🔧 리팩토링 / 작업"
description: "리팩토링, 설정, 문서 등 기타 작업을 등록합니다."
title: "[REFACTOR] "
labels: ["refactor"]
assignees: []
body:
  - type: dropdown
    id: type
    attributes:
      label: "🏷️ 작업 종류"
      options:
        - 리팩토링
        - 설정 (Config / CI)
        - 문서 (Docs)
        - 테스트
        - 기타
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: "🤔 작업 이유"
      description: "왜 이 작업이 필요한가요?"
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: "✅ 작업 목록"
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
