name: "✨ 기능 개발"
description: "새로운 기능 추가 또는 개선을 제안합니다."
title: "[FEAT] "
labels: ["feature"]
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: "📝 기능 설명"
      description: "어떤 기능을 개발하나요?"
      placeholder: "예) 회원가입 API 구현"
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: "✅ 작업 목록 (To-do)"
      description: "체크박스로 세부 작업을 나눠 주세요."
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: spec
    attributes:
      label: "📐 상세 스펙 / API 명세"
      description: "엔드포인트, 요청/응답 형식, ERD 변경 등"
      placeholder: |
        POST /api/users/signup
        Request: { "email": "", "password": "" }
        Response: 201 Created

  - type: dropdown
    id: area
    attributes:
      label: "📍 작업 영역"
      options:
        - Backend
        - Frontend
        - DB
        - Infra / 배포
        - 기타
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: "📅 마감 기한"
      placeholder: "예) 2026-11-02"

  - type: textarea
    id: reference
    attributes:
      label: "🔗 참고 자료"
      description: "관련 이슈, 문서, 링크 등"
